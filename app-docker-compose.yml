services:
  app:
    image: pdf-extractext:v${VERSION}
    container_name: app
    ports:
      - 8000:8000
    networks:
      - mired
    environment:
      - TZ=${TZ}
      - MONGODB_URI=${MONGODB_URI}
      - USERNAME=${USERNAME}
      - PASSWORD=${PASSWORD}
      - MONGO_DATA_PATH=${MONGO_DATA_PATH}

networks:
  mired:
    external: true
